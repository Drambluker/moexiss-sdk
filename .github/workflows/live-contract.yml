name: MOEX ISS live contract

on:
  workflow_call:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moex-iss-live-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    runs-on: ${{ vars.MOEX_LIVE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      MOEX_CA_CERT: vendor/certs/russian-trusted-root-ca.pem

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check MOEX ISS availability
        shell: bash
        run: |
          endpoint='https://iss.moex.com/iss/engines.json?iss.meta=off&iss.only=engines'
          check_availability() {
            curl --fail --silent --show-error --location \
              --connect-timeout 5 --max-time 15 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --output /dev/null "$@" "$endpoint"
          }

          status=0
          check_availability || status=$?
          if [[ "$status" == 60 ]]; then
            status=0
            check_availability --cacert "$MOEX_CA_CERT" || status=$?
          fi
          if [[ "$status" != 0 ]]; then
            echo '::error title=MOEX ISS unavailable::Cannot connect to iss.moex.com from this runner. The API contract was not checked.'
            exit 2
          fi

      - name: Verify live MOEX ISS contract
        shell: bash
        run: |
          trust_dir=$(mktemp -d "$RUNNER_TEMP/moex-trust.XXXXXX")
          trap 'rm -rf -- "$trust_dir"' EXIT
          trust_store="$trust_dir/cacerts"

          if [[ -n "${MOEX_LIVE_TRUST_STORE:-}" ]]; then
            source_password=(-srcstorepass changeit)
            if [[ -n "${MOEX_LIVE_TRUST_STORE_PASSWORD_FILE:-}" ]]; then
              source_password=(-srcstorepass:file "$MOEX_LIVE_TRUST_STORE_PASSWORD_FILE")
            fi
            "$JAVA_HOME/bin/keytool" -importkeystore -noprompt \
              -srckeystore "$MOEX_LIVE_TRUST_STORE" "${source_password[@]}" \
              -destkeystore "$trust_store" -deststoretype PKCS12 -deststorepass changeit
          else
            cp "$JAVA_HOME/lib/security/cacerts" "$trust_store"
            chmod u+w "$trust_store"
          fi

          "$JAVA_HOME/bin/keytool" -importcert -noprompt \
            -alias "russian-trusted-root-ca-${trust_dir##*.}" -file "$MOEX_CA_CERT" \
            -keystore "$trust_store" -storepass changeit

          trust_options="-Djavax.net.ssl.trustStore=\"$trust_store\""
          trust_options+=" -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit"
          ./mvnw --batch-mode --no-transfer-progress clean verify -Plive-contract-tests \
            "-Dmoex.live.jvmArgs=$trust_options"

      - name: Upload Failsafe reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moex-iss-live-contract-reports
          path: target/failsafe-reports
          if-no-files-found: warn
          retention-days: 7
